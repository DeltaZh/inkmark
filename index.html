<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>delta-ink</title>
  </head>

  <body>
    <div id="root"></div>
    <!-- 尽早屏蔽 WebView 默认右键（重新载入 / 检查元素）；编辑菜单由 React 绘制 -->
    <script>
      document.addEventListener(
        'contextmenu',
        function (e) {
          e.preventDefault();
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
